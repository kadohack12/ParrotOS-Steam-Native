name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: ShellCheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verification syntaxique
        run: |
          set -e
          bash -n install.sh uninstall.sh parrot-steam-native.sh
          find lib tests -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        run: |
          set -e
          # shellcheck is preinstalled on the ubuntu-latest image; only reach for
          # apt if it is genuinely missing (an apt mirror stall must not block CI).
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck install.sh uninstall.sh parrot-steam-native.sh lib/*.sh tests/*.sh
      - name: Tests NVIDIA (simules)
        run: bash tests/test-nvidia.sh
